---
  - name: Deploy and configure Telegram bot with Docker Compose
    hosts: all
    become: yes
    vars:
      project_dir: /home/larkin/tgbot
      compose_file: "{{ project_dir }}/docker-compose.yml"
      repo_url: https://github.com/Larchik282/devops_bot/
      bot_dir: "{{ project_dir }}/bot"
  
    tasks:
      - name: Install required packages
        apt:
          name:
            - python3
            - python3-pip
            - docker.io
            - docker-compose
            - git
          state: present
          update_cache: yes
  
      - name: Ensure Docker service is running
        service:
          name: docker
          state: started
          enabled: yes
  
      - name: Create project directory
        file:
          path: "{{ project_dir }}"
          state: directory
          mode: '0755'
  
      - name: Clone the repository
        git:
          repo: "{{ repo_url }}"
          dest: "{{ project_dir }}"
          version: main
  
      - name: Install Python requirements
        pip:
          requirements: "{{ bot_dir }}/requirements.txt"
          executable: pip3
  
      - name: Pull Docker images
        command: docker-compose -f "{{ compose_file }}" pull
        args:
          chdir: "{{ project_dir }}"
  
      - name: Start services with Docker Compose
        command: docker-compose -f "{{ compose_file }}" up -d
        args:
          chdir: "{{ project_dir }}"
  