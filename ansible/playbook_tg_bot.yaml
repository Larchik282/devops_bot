---
- hosts: db
  become: yes

  vars_files:
    - vars.yml

  pre_tasks:
    - name: "Install packages"
      apt:
        name:
          - postgresql
        state: present
        update_cache: yes
      become: yes

    - name: "Install Python packages"
      apt:
        name: python3-psycopg2
        state: present
        update_cache: yes
      become: yes
  tasks:
    - name: "Find out if PostgreSQL is initialized"
      ansible.builtin.stat:
        path: "/var/lib/pgsql/data/pg_hba.conf"
      register: postgres_data

 
    - name: "Start and enable services"
      service: "name={{ item }} state=started enabled=yes"
      with_items:
        - postgresql

    - name: "Create app database"
      postgresql_db:
        state: present
        name: "{{ db_name }}"
      become: yes
      become_user: postgres

    - name: "Create db user"
      postgresql_user:
        state: present
        name: "{{ db_user }}"
        password: "{{ db_password }}"
      become: yes
      become_user: postgres

    - name: "Grant db user access to app db"
      postgresql_privs:
        type: database
        database: "{{ db_name }}"
        roles: "{{ db_user }}"
        grant_option: no
        privs: all
      become: yes
      become_user: postgres

    - name: "Allow md5 connection for the db user"
      postgresql_pg_hba:
        dest: "~/15/main/pg_hba.conf"
        contype: host
        databases: all
        method: md5
        users: "{{ [db_user, db_user_repl] | join(',') }}"
        create: true
      become: yes
      become_user: postgres
      notify: restart postgres

    - name: Set listen_addresses in postgresql.conf
      lineinfile:
        path: /etc/postgresql/{{ postgresql_version }}/main/postgresql.conf
        regexp: '^#?listen_addresses\s*='
        line: "listen_addresses = '*'"
        state: present
      notify: restart postgres

    - name: Set log_connections in postgresql.conf
      lineinfile:
        path: /etc/postgresql/{{ postgresql_version }}/main/postgresql.conf
        regexp: '^#?log_connections\s*='
        line: "log_connections = on"
        state: present
      notify: restart postgres

    - name: Set log_disconnections in postgresql.conf
      lineinfile:
        path: /etc/postgresql/{{ postgresql_version }}/main/postgresql.conf
        regexp: '^#?log_disconnections\s*='
        line: "log_disconnections = on"
        state: present
      notify: restart postgres

    - name: Set log_replication_commands in postgresql.conf
      lineinfile:
        path: /etc/postgresql/{{ postgresql_version }}/main/postgresql.conf
        regexp: '^#?log_replication_commands\s*='
        line: "log_replication_commands = on"
        state: present
      notify: restart postgres

    - name: Set wal_level in postgresql.conf
      lineinfile:
        path: /etc/postgresql/{{ postgresql_version }}/main/postgresql.conf
        regexp: '^#?wal_level\s*='
        line: "wal_level = replica"
        state: present
      notify: restart postgres

    - name: Set max_wal_senders in postgresql.conf
      lineinfile:
        path: /etc/postgresql/{{ postgresql_version }}/main/postgresql.conf
        regexp: '^#?max_wal_senders\s*='
        line: "max_wal_senders = 3"
        state: present
      notify: restart postgres


    - name: Create replication user
      postgresql_user:
        name: "{{ repl_user }}"
        password: "{{ 1234 }}"
        role_attr_flags: REPLICATION
      become_user: postgres  



    - name: Configure pg_hba.conf for replication
      lineinfile:
        path: /etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf
        regexp: '^host\s+replication\s+{{ repl_user }}\s+{{ replica_ip }}\s+md5'
        line: "host    replication    {{ repl_user }}    {{ replica_ip }}/32    md5"
        state: present
      notify: restart postgres






    - name: "Load SQL script into a variable"
      set_fact:
        migration_sql: "{{ lookup('file', 'migration.sql') }}"

    - name: "Execute SQL commands"
      command: >
        psql ptdev -c "
        CREATE TABLE IF NOT EXISTS phone (
          id SERIAL PRIMARY KEY,
          phonenum VARCHAR(20) NOT NULL
        );
        CREATE TABLE IF NOT EXISTS mails (
          id SERIAL PRIMARY KEY,
          mail VARCHAR(255) NOT NULL
        );"
      become: yes
      become_user: postgres



  handlers:
    - name: restart postgres
      service: name=postgresql state=restarted


- name: For bot
  hosts: bot
  become: yes

  vars_files:
    - vars.yml

  tasks:
    - name: "Clone the repository"
      git:
        repo: "https://github.com/Larchik282/devops_bot"
        dest: "~/devops_bot"
        version: ansible
      become: yes

    - name: "Install Python requirements"
      command: >
        python3 -m pip install --break-system-packages -r ~/devops_bot/ansible/requirements.txt
      become: yes


    - name: "Copy .env file"
      copy:
        src: ".env"
        dest: "~/devops_bot/.env"
      become: yes

    - name: "Run the Telegram bot"
      command: >
        python3 ~/devops_bot/ansible/botForAnsible.py
      async: 3600  # Run the bot for 1 hour
      poll: 0





- name: Configure PostgreSQL replica for replication
  hosts: replica

  become: yes

  vars_files:
    - vars.yml
  tasks:
    - name: Stop PostgreSQL
      service:
        name: postgresql
        state: stopped

    - name: Remove existing data directory
      file:
        path: /var/lib/postgresql/data
        state: absent

    - name: Copy data from master to replica
      command: pg_basebackup -R -h {{ db_for_repl }} -U repl_user -D /var/lib/postgresql/data -P
      environment:
        PGPASSWORD: "{{ 1234 }}"
      become_user: postgres

    - name: Start PostgreSQL
      service:
        name: postgresql
        state: started
