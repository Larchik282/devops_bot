# postgresql.conf

# Прослушивание всех IP-адресов (для доступа по сети)
listen_addresses = '*'

# Порт, на котором работает PostgreSQL
port = 5432

# Максимальное количество подключений
max_connections = 100

# Настройки памяти
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB

# Включение журнала запросов (полезно для отладки)
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_statement = 'all'

# Включение автовакуума
autovacuum = on
